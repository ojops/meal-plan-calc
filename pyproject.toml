
[project]
name = "meal-plan-calc"
version = "0.1.0"
description = "Meal plan calculation and nutrition analysis"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = []

[project.scripts]
meal-plan-calc = "meal_plan_calc.main:main"

[project.optional-dependencies]
optimise = ["scipy==1.15.3"]
demo = [
    "pillow==12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meal_plan_calc"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "meal_plan_calc/data"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff==0.14.3",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
