
[project]
name = "meal-plan-calc"
version = "0.1.0"
description = "Meal plan calculation and nutrition analysis"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meal_plan_calc"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
